[tool.briefcase]
project_name = "DirectSave"
bundle = "com.maverick.directsave"
version = "1.4.0"
url = "https://github.com/Cptmaverick-22/DirectSave"
license = "GPL-3.0+"
license-files = ["LICENSE"]
author = "Cptmaverick-22"

[tool.briefcase.app.directsave]
formal_name = "DirectSave"
description = "Save what you love"
long_description = "Save what you love — download videos and audio cleanly on Android and desktop."
icon = "android/icons/icon"
sources = [
    "android/directsave",
    "config.py",
    "downloader.py",
    "logs.py",
    "updater.py",
]
requires = [
    "yt-dlp",
]

[tool.briefcase.app.directsave.android]
requires = [
    "toga-android>=0.5.0",
]
android_abis = ["arm64-v8a"]

[tool.briefcase.app.directsave.android.permission]
"android.permission.INTERNET" = {}
"android.permission.ACCESS_NETWORK_STATE" = {}
"android.permission.READ_EXTERNAL_STORAGE" = { max_sdk_version = "32" }
"android.permission.WRITE_EXTERNAL_STORAGE" = { max_sdk_version = "29" }
"android.permission.MANAGE_EXTERNAL_STORAGE" = {}

[tool.briefcase.app.directsave.windows]
requires = [
    "toga-winforms>=0.5.0",
]

[tool.briefcase.app.directsave.linux]
requires = [
    "toga-gtk>=0.5.0",
]