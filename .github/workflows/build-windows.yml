name: Build Windows GUI App

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read APP_VERSION from config.py
        id: meta
        shell: pwsh
        run: |
          $version = python -c "import config; print(config.APP_VERSION)"
          if (-not $version) { throw "Could not read APP_VERSION from config.py" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Detected version: $version"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Windows FFmpeg and Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null

          # 1. FFmpeg + FFprobe (GPL static build)
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
          Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Include "ffmpeg.exe","ffprobe.exe" |
            Copy-Item -Destination "bin" -Force

          # 2. Deno (JavaScript runtime for yt-dlp-ejs)
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno_tmp" -Force
          Get-ChildItem -Path "deno_tmp" -Recurse -Filter "deno.exe" |
            Copy-Item -Destination "bin" -Force

          foreach ($tool in @("ffmpeg.exe", "ffprobe.exe", "deno.exe")) {
            if (-not (Test-Path "bin\$tool")) {
              throw "Missing required binary: bin\$tool"
            }
          }

      - name: Build Windows app with PyInstaller
        run: pyinstaller --clean --noconfirm ytdownloader.spec

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist\YTDownloader\YTDownloader.exe")) {
            throw "YTDownloader.exe was not created."
          }
          foreach ($tool in @("ffmpeg.exe", "ffprobe.exe", "deno.exe")) {
            if (-not (Test-Path "dist\YTDownloader\_internal\$tool")) {
              throw "Bundled binary missing from _internal: $tool"
            }
          }

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          & $iscc "/DMyAppVersion=${{ steps.meta.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Windows-Installer
          path: dist/installer/*.exe

      - name: Upload Windows Portable Build
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Windows-Portable
          path: dist/YTDownloader/