name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17 (required by Briefcase & Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle packages and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'android/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Briefcase and Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase pillow

      - name: Generate Android launcher icon sizes
        run: |
          python -c '
          from pathlib import Path
          from PIL import Image

          src = Path("android/ytdownloader/resources/icon.png")
          out_dir = Path("android/icons")
          out_dir.mkdir(parents=True, exist_ok=True)
          if src.is_file():
              img = Image.open(src).convert("RGBA")
              for size in (48, 72, 96, 144, 192):
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(out_dir / f"icon-round-{size}.png")
                  resized.save(out_dir / f"icon-square-{size}.png")
                  resized.save(out_dir / f"icon-{size}.png")
          '

      - name: Create Android project
        run: briefcase create android --no-input

      - name: Build Android project
        run: briefcase build android -r --no-input

      - name: Package unsigned release APK
        run: briefcase package android -p apk -u --no-input

      - name: Align and sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          mkdir -p release-apk

          UNSIGNED_APK=$(find dist -maxdepth 3 -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No APK found in dist/"
            exit 1
          fi

          # Locate Android SDK build-tools (runner preinstalled or Briefcase cache)
          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" "$HOME/.cache/briefcase/tools/android_sdk/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Could not locate Android build-tools (zipalign/apksigner)."
            exit 1
          fi
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          # Decode keystore from GitHub Secret
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          # Zipalign and sign with v2/v3 APK Signature Scheme
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          SIGNED_APK="release-apk/YTDownloader-Android.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "env:ANDROID_KEYSTORE_PASS" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "env:ANDROID_KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # Verify signature and remove temporary keystore
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          rm -f "$KEYSTORE_PATH" "$ALIGNED_APK"
          ls -lh release-apk/

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Android-APK
          path: release-apk/YTDownloader-Android.apk
          retention-days: 14

      - name: Attach signed APK to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/YTDownloader-Android.apk

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefcase-logs
          path: logs/
          if-no-files-found: ignore